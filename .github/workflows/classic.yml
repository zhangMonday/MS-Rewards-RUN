name: 运行 Microsoft Rewards 原版

# 本工作流按计划（以及按需）运行 Microsoft Rewards 脚本。
# 它不运行存储本工作流文件的仓库代码，
# 而是检出 zhangMonday/Microsoft-Rewards-Script@v4 并运行。
#
# 所需的 secrets/variables 详见 .github/workflows/README.md。

on:
    # 手动触发，支持运行时覆盖参数。
    workflow_dispatch:
        inputs:
            debug_logs:
                description: '强制本次运行启用 debugLogs=true'
                type: boolean
                default: false
            run_on_zero_points:
                description: '强制本次运行启用 searchSettings.runOnZeroPoints=true'
                type: boolean
                default: false

# 不同时运行两个 rewards 任务（sessions.db 会冲突）。
concurrency:
    group: run-microsoft-rewards
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # 前置 job：统计 ACCOUNTS_ENV 中的账号数量，按每 5 个账号一片计算分片数，
    # 输出动态 matrix，供 run job 并行执行。<=5 个账号时只输出 1 个分片，行为不变。
    prepare:
        name: 计算账号分片
        runs-on: ubuntu-latest
        outputs:
            shards: ${{ steps.split.outputs.shards }}
            total: ${{ steps.split.outputs.total }}
        steps:
            - name: 统计账号数量并生成分片矩阵
              id: split
              env:
                  ACCOUNTS_ENV: ${{ secrets.ACCOUNTS_ENV }}
              run: |
                  set -euo pipefail
                  if [ -z "${ACCOUNTS_ENV:-}" ]; then
                    echo "::error::Secret ACCOUNTS_ENV 为空。请添加 ACCOUNT_1_EMAIL / ACCOUNT_1_PASSWORD（等）到其中。"
                    exit 1
                  fi
                  printf '%s\n' "$ACCOUNTS_ENV" > .env.full
                  TOTAL=$(grep -cE '^ACCOUNT_[0-9]+_EMAIL=' .env.full || true)
                  if [ "$TOTAL" -eq 0 ]; then
                    echo "::error::ACCOUNTS_ENV 中未找到任何 ACCOUNT_N_EMAIL 配置。"
                    exit 1
                  fi
                  # 每 5 个账号一个 job，向上取整，数量不设上限。
                  SHARDS=$(( (TOTAL + 4) / 5 ))
                  echo "账号总数: ${TOTAL}，分片（job）数: ${SHARDS}"
                  SHARDS_JSON=$(jq -cn --argjson n "$SHARDS" '[range(0; $n) | {shard: ., display: "\(.+1)/\($n)"}]')
                  echo "shards=${SHARDS_JSON}" >> "$GITHUB_OUTPUT"
                  echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"

    run:
        name: 运行 rewards（分片 ${{ matrix.chunk.display }}）
        needs: prepare
        runs-on: ubuntu-latest

        strategy:
            # 某个分片失败不影响其他分片继续执行。
            fail-fast: false
            matrix:
                chunk: ${{ fromJSON(needs.prepare.outputs.shards) }}

        env:
            # 实际运行的源仓库（不是存储本工作流的仓库）。
            SOURCE_REPO: TheNetsky/Microsoft-Rewards-Script
            SOURCE_REF: v4

        steps:
            # 1. 检出源仓库，而非当前仓库。
            - name: 检出源仓库
              uses: actions/checkout@v7
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ env.SOURCE_REF }}
                  persist-credentials: false

            - name: 设置时区为北京时间
              run: |
                  sudo timedatectl set-timezone Asia/Shanghai
                  echo "当前时间: $(date)"

            - name: 下载中文字体
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fonts-wqy-zenhei

            - name: 安装Xvfb虚拟显示器
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb

            - name: 启动虚拟显示器
              run: |
                  Xvfb :99 -screen 0 1024x768x24 &
                  echo "DISPLAY=:99" >> $GITHUB_ENV

            # 2. Node.js 24（脚本的 package.json engines 字段要求）。
            - name: 设置 Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # 3. 安装依赖（跳过生命周期脚本；浏览器将单独安装）。
            - name: 安装依赖
              run: npm ci --ignore-scripts

            # 4. 在运行间缓存 Patchright/Chromium 浏览器下载。
            - name: 缓存 Patchright 浏览器
              id: browser-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: patchright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      patchright-chromium-${{ runner.os }}-

            - name: 安装 Chromium（含系统依赖）
              run: npx patchright install --with-deps chromium

            # 5. 从上次运行恢复登录会话，避免重复 2FA/登录。
            #    缓存以运行编号 + 分片号为键，每个分片（job）独立读写自己的会话缓存，
            #    避免并行分片之间互相覆盖；并兼容恢复旧的未分片缓存。
            - name: 恢复会话
              id: sessions-cache
              uses: actions/cache@v6
              with:
                  path: sessions
                  key: msr-sessions-shard-${{ matrix.chunk.shard }}-${{ github.run_id }}
                  restore-keys: |
                      msr-sessions-shard-${{ matrix.chunk.shard }}-
                      msr-sessions-

            # 6. 将账户凭据从 ACCOUNTS_ENV secret 写入 .env.full（完整账号列表）。
            #    ACCOUNTS_ENV 包含完整的 .env 文件内容（ACCOUNT_1_EMAIL=... 等）。
            - name: 写入 .env.full
              env:
                  ACCOUNTS_ENV: ${{ secrets.ACCOUNTS_ENV }}
              run: |
                  if [ -z "$ACCOUNTS_ENV" ]; then
                    echo "::error::Secret ACCOUNTS_ENV 为空。请添加 ACCOUNT_1_EMAIL / ACCOUNT_1_PASSWORD（等）到其中。"
                    exit 1
                  fi
                  printf '%s\n' "$ACCOUNTS_ENV" > .env.full
                  echo "已写入 .env.full，共 $(grep -cE '^ACCOUNT_[0-9]+_EMAIL=' .env.full || true) 个账户邮箱行。"

            # 6b. 按分片拆分账号配置：每个 job 只保留属于自己的账号（按邮箱行排序后每 5 个一片），
            #     并重排为 ACCOUNT_1..N，非账号行（如 API_TOKEN 等其他配置）原样保留。
            #     单分片（<=5 个账号）时不做拆分，与原有单 job 逻辑完全一致。
            - name: 按分片生成 .env
              env:
                  SHARD: ${{ matrix.chunk.shard }}
              run: |
                  set -euo pipefail
                  TOTAL=$(grep -cE '^ACCOUNT_[0-9]+_EMAIL=' .env.full || true)
                  SHARDS=$(( (TOTAL + 4) / 5 ))
                  if [ "$SHARDS" -le 1 ]; then
                    cp .env.full .env
                    echo "账号数 ${TOTAL} <= 5，单 job 运行，.env 不做拆分。"
                  else
                    mapfile -t ACCTS < <(grep -oE '^ACCOUNT_[0-9]+_EMAIL=' .env.full | sed -E 's/^ACCOUNT_([0-9]+)_EMAIL=/\1/' | sort -nu)
                    START=$((SHARD * 5))
                    grep -vE '^ACCOUNT_[0-9]+_' .env.full > .env || true
                    NEW=1
                    for OLD in "${ACCTS[@]:$START:5}"; do
                      grep -E "^ACCOUNT_${OLD}_" .env.full | sed -E "s/^ACCOUNT_${OLD}_/ACCOUNT_${NEW}_/" >> .env
                      echo "  原账号槽位 ${OLD} -> 本 job 槽位 ${NEW}"
                      NEW=$((NEW + 1))
                    done
                    echo "分片 $((SHARD + 1))/${SHARDS}：总账号 ${TOTAL} 个，本 job 负责 $((NEW - 1)) 个。"
                  fi

            # 7. 构建 config.json。
            #    - 如果设置了 CONFIG_JSON variable/secret，则原样使用（支持所有配置选项）。
            #    - 否则使用仓库的 config.example.json 作为基础。
            #    然后强制设置 CI 中必须不同的参数（headless、diagnostics），
            #    并应用可选的 workflow_dispatch 覆盖参数。
            - name: 构建 config.json
              env:
                  CONFIG_JSON: ${{ vars.CONFIG_JSON != '' && vars.CONFIG_JSON || secrets.CONFIG_JSON }}
                  INPUT_DEBUG_LOGS: ${{ inputs.debug_logs }}
                  INPUT_RUN_ON_ZERO_POINTS: ${{ inputs.run_on_zero_points }}
              run: |
                  set -euo pipefail
                  if [ -n "${CONFIG_JSON:-}" ]; then
                    printf '%s' "$CONFIG_JSON" > config.json
                    echo "使用来自仓库 variable/secret 的 CONFIG_JSON。"
                  else
                    cp config.example.json config.json
                    echo "未设置 CONFIG_JSON；使用 config.example.json 作为基础。"
                  fi

                  # 提前验证 JSON 格式。
                  jq empty config.json

                  # 保留 config.json 中的 headless 设置；Xvfb 仅提供可选的虚拟显示环境。
                  tmp=$(mktemp)
                  jq '.errorDiagnostics = true' config.json > "$tmp" && mv "$tmp" config.json

                  if [ "${INPUT_DEBUG_LOGS}" = "true" ]; then
                    jq '.debugLogs = true' config.json > "$tmp" && mv "$tmp" config.json
                  fi
                  if [ "${INPUT_RUN_ON_ZERO_POINTS}" = "true" ]; then
                    jq '.searchSettings.runOnZeroPoints = true' config.json > "$tmp" && mv "$tmp" config.json
                  fi

            # 8. 构建并运行。
            - name: 构建
              run: npm run build

            - name: 运行 Microsoft Rewards 脚本
              run: npm start

            # 9. 持久化更新后的会话以供下次运行使用。
            - name: 保存会话
              if: always()
              uses: actions/cache/save@v6
              with:
                  path: sessions
                  key: msr-sessions-shard-${{ matrix.chunk.shard }}-${{ github.run_id }}

            # 10. 上传诊断/日志文件用于故障排查（保留 7 天）。
            - name: 上传诊断信息
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: rewards-diagnostics-${{ github.run_id }}-shard${{ matrix.chunk.shard }}
                  path: |
                      diagnostics/
                      *.log
                  if-no-files-found: ignore
                  retention-days: 7
