name: 运行 Microsoft Rewards

# 所需 Secrets：
#   ACCOUNTS_ENV
#   SOURCE_REPO_TOKEN
#   proxy_api
#
# proxy_api 中保存完整的代理接口 URL，不要写入本 yaml。

on:
    workflow_dispatch:
        inputs:
            debug_logs:
                description: '强制本次运行启用 debugLogs=true'
                type: boolean
                default: false
            run_on_zero_points:
                description: '强制本次运行启用 searchSettings.runOnZeroPoints=true'
                type: boolean
                default: false

    schedule:
        - cron: '11 7 * * *'
        - cron: '11 19 * * *'

# 不同时运行两个 rewards 任务（sessions.db 会冲突）。
concurrency:
    group: run-microsoft-rewards
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # 前置 job：
    # 1. 统计账号并生成分片矩阵；
    # 2. 判断哪些账号需要自动代理；
    # 3. 从 proxy_api 获取代理；
    # 4. 并发测试所有代理访问百度；
    # 5. 将测速后的代理结果传给各分片 job。
    prepare:
        name: 计算账号分片和测试代理
        runs-on: ubuntu-latest

        outputs:
            shards: ${{ steps.split.outputs.shards }}
            total: ${{ steps.split.outputs.total }}
            proxies: ${{ steps.split.outputs.proxies }}

        steps:
            - name: 统计账号、获取并测试代理
              id: split
              env:
                  ACCOUNTS_ENV: ${{ secrets.ACCOUNTS_ENV }}
                  PROXY_API: ${{ secrets.proxy_api }}
              run: |
                  set -euo pipefail

                  if [ -z "${ACCOUNTS_ENV:-}" ]; then
                    echo "::error::Secret ACCOUNTS_ENV 为空。请添加 ACCOUNT_1_EMAIL / ACCOUNT_1_PASSWORD 等配置。"
                    exit 1
                  fi

                  printf '%s\n' "$ACCOUNTS_ENV" > .env.full

                  TOTAL=$(grep -cE '^[[:space:]]*ACCOUNT_[0-9]+_EMAIL=' .env.full || true)

                  if [ "$TOTAL" -eq 0 ]; then
                    echo "::error::ACCOUNTS_ENV 中未找到任何 ACCOUNT_N_EMAIL 配置。"
                    exit 1
                  fi

                  # 每 5 个账号一个 job。
                  SHARDS=$(( (TOTAL + 4) / 5 ))

                  echo "账号总数: ${TOTAL}"
                  echo "分片 job 数: ${SHARDS}"

                  SHARDS_JSON=$(jq -cn \
                    --argjson n "$SHARDS" \
                    '[range(0; $n) | {shard: ., display: "\(.+1)/\($n)"}]')

                  python3 <<'PY'
                  import concurrent.futures
                  import json
                  import os
                  import re
                  import subprocess
                  import urllib.request

                  ENV_FILE = ".env.full"
                  OUTPUT_FILE = ".proxies.json"

                  # 使用 HTTP 而非 HTTPS 测速。
                  # 部分免费 SOCKS4/HTTP 代理无法稳定处理 HTTPS，
                  # 但仍然可以正常访问百度 HTTP 页面。
                  BAIDU_URL = "http://www.baidu.com/"

                  # 要求：20 秒内收到百度任意 HTTP 响应即视为可用。
                  TEST_TIMEOUT = 20

                  # 同时测试的代理数量。
                  MAX_WORKERS = 50

                  email_re = re.compile(
                      r"^\s*ACCOUNT_(\d+)_EMAIL\s*=",
                      re.IGNORECASE,
                  )

                  proxy_re = re.compile(
                      r"^\s*(?:(#)\s*)?"
                      r"ACCOUNT_(\d+)_PROXY_(URL|PORT)\s*=(.*)$",
                      re.IGNORECASE,
                  )

                  def clean_log_text(value, limit=300):
                      """
                      防止接口返回内容中带有换行或 GitHub Actions 命令格式。
                      """
                      text = str(value or "")
                      text = text.replace("\r", " ").replace("\n", " ")
                      text = text.replace("::", "：")
                      return text[:limit]

                  with open(ENV_FILE, "r", encoding="utf-8") as file:
                      lines = file.read().splitlines()

                  account_ids = sorted({
                      int(match.group(1))
                      for line in lines
                      if (match := email_re.match(line))
                  })

                  proxy_entries = {
                      account_id: {
                          "active": {},
                          "commented": {},
                      }
                      for account_id in account_ids
                  }

                  # 读取账号中已有的代理设置，用于判断是否需要请求代理接口。
                  for line in lines:
                      match = proxy_re.match(line)

                      if not match:
                          continue

                      is_commented = bool(match.group(1))
                      account_id = int(match.group(2))
                      field = match.group(3).upper()
                      value = match.group(4).strip()

                      if account_id not in proxy_entries:
                          continue

                      if is_commented:
                          proxy_entries[account_id]["commented"][field] = value
                      else:
                          proxy_entries[account_id]["active"][field] = value

                  def classify(account_id):
                      """
                      existing：
                        URL、PORT 都未注释且有值，保留用户已有代理。

                      disabled：
                        代理行未注释但为空/不完整；
                        或代理行被注释但其中存在值。
                        这些均表示用户明确要求不用代理。

                      auto：
                        没有代理行；
                        或代理行被注释且全部为空。
                        这些账号将自动获取代理。
                      """
                      entry = proxy_entries[account_id]
                      active = entry["active"]
                      commented = entry["commented"]

                      if (
                          active.get("URL", "") != ""
                          and active.get("PORT", "") != ""
                      ):
                          return "existing"

                      if active:
                          return "disabled"

                      if any(value != "" for value in commented.values()):
                          return "disabled"

                      return "auto"

                  auto_account_ids = [
                      account_id
                      for account_id in account_ids
                      if classify(account_id) == "auto"
                  ]

                  print(
                      f"账号代理状态："
                      f"已有代理 {sum(classify(i) == 'existing' for i in account_ids)} 个，"
                      f"明确不用代理 {sum(classify(i) == 'disabled' for i in account_ids)} 个，"
                      f"需要自动代理 {len(auto_account_ids)} 个。"
                  )

                  def write_empty(reason):
                      print(
                          f"::warning::{reason}；"
                          "需要自动代理的账号将使用 GitHub Actions Runner 本机 IP。"
                      )

                      with open(OUTPUT_FILE, "w", encoding="utf-8") as file:
                          json.dump([], file, separators=(",", ":"))

                  # 没有自动代理需求时，不调用接口。
                  if not auto_account_ids:
                      print("没有需要自动配置代理的账号，跳过代理接口请求。")

                      with open(OUTPUT_FILE, "w", encoding="utf-8") as file:
                          json.dump([], file, separators=(",", ":"))

                      raise SystemExit(0)

                  proxy_api = os.environ.get("PROXY_API", "").strip()

                  if not proxy_api:
                      write_empty("Secret proxy_api 未配置")
                      raise SystemExit(0)

                  # 不打印请求地址，防止 proxy_api Secret 泄露到日志。
                  try:
                      request = urllib.request.Request(
                          proxy_api,
                          headers={
                              "User-Agent": "GitHub-Actions-Proxy-Checker/1.0",
                              "Accept": "application/json",
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30,
                      ) as response:
                          api_result = json.load(response)

                  except Exception:
                      write_empty("代理接口请求失败")
                      raise SystemExit(0)

                  api_code = str(api_result.get("code", ""))

                  if api_code != "10001":
                      api_msg = clean_log_text(api_result.get("msg", ""))
                      write_empty(
                          f"代理接口返回错误代码 {api_code}，信息：{api_msg}"
                      )
                      raise SystemExit(0)

                  raw_proxies = (
                      api_result
                      .get("data", {})
                      .get("proxy_list", [])
                      or []
                  )

                  # 不再进行严格 IP 地址格式验证。
                  # 只要求协议、IP/主机字段和端口存在即可；
                  # 真实可用性完全由后续 curl 访问百度测试决定。
                  #
                  # socks4 / socks4a / socks5 / socks5h：
                  # GitHub Runner 自带 curl 均支持。
                  supported_protocols = {
                      "http",
                      "https",
                      "socks4",
                      "socks4a",
                      "socks5",
                      "socks5h",
                  }

                  candidates = []
                  seen = set()
                  rejected_count = 0

                  for proxy in raw_proxies:
                      try:
                          ip = str(proxy.get("ip", "")).strip()
                          port_raw = proxy.get("port")
                          port = int(port_raw)

                          protocol = str(
                              proxy.get("protocol", "")
                          ).strip().lower()

                          adr = clean_log_text(proxy.get("adr", "未知地区"))
                          level = clean_log_text(proxy.get("level", "未知"))

                          # 协议字段为空时按 HTTP 尝试，
                          # 避免因接口偶发缺少 protocol 而过早过滤代理。
                          if not protocol:
                              protocol = "http"

                          if not ip or not (1 <= port <= 65535):
                              rejected_count += 1
                              print(
                                  "代理格式无效，跳过："
                                  f"ip={clean_log_text(ip)} "
                                  f"port={clean_log_text(port_raw)} "
                                  f"protocol={clean_log_text(protocol)} "
                                  f"adr={adr}"
                              )
                              continue

                          # 接口若给出了未知协议，仍按 HTTP 尝试。
                          # 这样比直接丢弃更宽松。
                          if protocol not in supported_protocols:
                              print(
                                  f"代理协议 {protocol} 不在常见列表中，"
                                  f"将按 http 协议测速："
                                  f"{ip}:{port}，adr={adr}"
                              )
                              protocol = "http"

                          key = (protocol, ip, port)

                          if key in seen:
                              continue

                          seen.add(key)

                          candidates.append({
                              "protocol": protocol,
                              "ip": ip,
                              "port": port,
                              "adr": adr,
                              "level": level,
                          })

                      except (TypeError, ValueError):
                          rejected_count += 1
                          print(
                              "代理字段无法解析，跳过："
                              f"{clean_log_text(proxy)}"
                          )

                  print(
                      f"代理接口返回 {len(raw_proxies)} 条记录；"
                      f"允许测速 {len(candidates)} 条；"
                      f"格式无效跳过 {rejected_count} 条。"
                  )

                  if not candidates:
                      write_empty("代理接口没有可测试的代理")
                      raise SystemExit(0)

                  print("========== 开始并发测试代理 ==========")
                  print(
                      f"测试地址：{BAIDU_URL}；"
                      f"单个代理最长：{TEST_TIMEOUT} 秒；"
                      f"并发数：{min(MAX_WORKERS, len(candidates))}"
                  )

                  def test_proxy(proxy):
                      ip = proxy["ip"]
                      port = proxy["port"]
                      protocol = proxy["protocol"]

                      # IPv6 形式地址在 URL 中须加方括号；
                      # 普通 IPv4 或主机名直接使用。
                      host = f"[{ip}]" if ":" in ip and not ip.startswith("[") else ip
                      proxy_url = f"{protocol}://{host}:{port}"

                      # 不使用 --fail：
                      # 只要代理能在 20 秒内成功返回任意 HTTP 状态码，
                      # 即说明网络通路有效。
                      #
                      # 例如 301、302、403、404 也会被记录为可连通，
                      # 避免免费代理因百度重定向、地区限制或反爬页面被误判失效。
                      command = [
                          "curl",
                          "--location",
                          "--silent",
                          "--show-error",
                          "--output",
                          "/dev/null",
                          "--connect-timeout",
                          str(TEST_TIMEOUT),
                          "--max-time",
                          str(TEST_TIMEOUT),
                          "--proxy",
                          proxy_url,
                          "--write-out",
                          "%{http_code}|%{time_total}|%{remote_ip}",
                          BAIDU_URL,
                      ]

                      try:
                          result = subprocess.run(
                              command,
                              stdout=subprocess.PIPE,
                              stderr=subprocess.PIPE,
                              text=True,
                              timeout=TEST_TIMEOUT + 3,
                              check=False,
                          )

                          output = result.stdout.strip()
                          error = clean_log_text(result.stderr.strip())

                          http_code = 0
                          latency = None
                          remote_ip = ""

                          try:
                              parts = output.split("|")
                              http_code = int(parts[0])
                              latency = float(parts[1])
                              remote_ip = clean_log_text(parts[2]) if len(parts) > 2 else ""
                          except (
                              IndexError,
                              TypeError,
                              ValueError,
                          ):
                              pass

                          # 只要收到有效 HTTP 状态码，且总时间未超过 20 秒，
                          # 即认定该代理可用。
                          #
                          # http_code=000 表示未收到 HTTP 响应，例如连接失败、
                          # TLS 失败、代理握手失败、超时等。
                          valid = (
                              result.returncode == 0
                              and 100 <= http_code <= 599
                              and latency is not None
                              and 0 < latency <= TEST_TIMEOUT
                          )

                          return {
                              **proxy,
                              "valid": valid,
                              "http_code": http_code,
                              "latency": latency,
                              "remote_ip": remote_ip,
                              "curl_exit_code": result.returncode,
                              "error": error,
                          }

                      except subprocess.TimeoutExpired:
                          return {
                              **proxy,
                              "valid": False,
                              "http_code": 0,
                              "latency": None,
                              "remote_ip": "",
                              "curl_exit_code": -1,
                              "error": f"curl 进程超过 {TEST_TIMEOUT + 3} 秒仍未结束",
                          }

                      except Exception as error:
                          return {
                              **proxy,
                              "valid": False,
                              "http_code": 0,
                              "latency": None,
                              "remote_ip": "",
                              "curl_exit_code": -2,
                              "error": clean_log_text(error),
                          }

                  results = []
                  worker_count = min(MAX_WORKERS, len(candidates))

                  with concurrent.futures.ThreadPoolExecutor(
                      max_workers=worker_count
                  ) as executor:
                      futures = [
                          executor.submit(test_proxy, proxy)
                          for proxy in candidates
                      ]

                      for future in concurrent.futures.as_completed(futures):
                          result = future.result()
                          results.append(result)

                          address = (
                              f"{result['protocol']}://"
                              f"{result['ip']}:{result['port']}"
                          )

                          if result["valid"]:
                              print(
                                  "✅ 有效代理 | "
                                  f"代理={address} | "
                                  f"地区={result['adr']} | "
                                  f"匿名度={result['level']} | "
                                  f"HTTP={result['http_code']} | "
                                  f"耗时={result['latency']:.3f}s | "
                                  f"百度远端IP={result['remote_ip'] or '未知'}"
                              )
                          else:
                              latency_text = (
                                  f"{result['latency']:.3f}s"
                                  if result["latency"] is not None
                                  else "无"
                              )

                              error_text = result["error"] or "未收到有效 HTTP 响应"

                              print(
                                  "❌ 无效代理 | "
                                  f"代理={address} | "
                                  f"地区={result['adr']} | "
                                  f"匿名度={result['level']} | "
                                  f"HTTP={result['http_code']} | "
                                  f"耗时={latency_text} | "
                                  f"curl退出码={result['curl_exit_code']} | "
                                  f"原因={error_text}"
                              )

                  usable = [
                      result
                      for result in results
                      if result["valid"]
                  ]

                  # 可用代理从快到慢排序。
                  usable.sort(key=lambda proxy: proxy["latency"])

                  print("========== 代理测速汇总 ==========")
                  print(
                      f"总测试数：{len(results)}；"
                      f"有效：{len(usable)}；"
                      f"无效：{len(results) - len(usable)}。"
                  )

                  if usable:
                      print("按速度排序后的有效代理：")

                      for index, proxy in enumerate(usable, start=1):
                          print(
                              f"  #{index} | "
                              f"{proxy['protocol']}://{proxy['ip']}:{proxy['port']} | "
                              f"地区={proxy['adr']} | "
                              f"匿名度={proxy['level']} | "
                              f"HTTP={proxy['http_code']} | "
                              f"耗时={proxy['latency']:.3f}s"
                          )
                  else:
                      print(
                          "::warning::全部代理未能在 20 秒内收到百度 HTTP 响应。"
                      )

                  # 后续 job 仅需要协议、地址和端口。
                  output = [
                      {
                          "protocol": proxy["protocol"],
                          "ip": proxy["ip"],
                          "port": proxy["port"],
                          "adr": proxy["adr"],
                          "latency": proxy["latency"],
                      }
                      for proxy in usable
                  ]

                  with open(OUTPUT_FILE, "w", encoding="utf-8") as file:
                      json.dump(
                          output,
                          file,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      )
                  PY

                  PROXIES_JSON=$(cat .proxies.json)

                  echo "shards=${SHARDS_JSON}" >> "$GITHUB_OUTPUT"
                  echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
                  echo "proxies=${PROXIES_JSON}" >> "$GITHUB_OUTPUT"

    run:
        name: 运行 rewards（分片 ${{ matrix.chunk.display }}）
        needs: prepare
        runs-on: ubuntu-latest

        strategy:
            # 某个分片失败不影响其他分片继续执行。
            fail-fast: false
            matrix:
                chunk: ${{ fromJSON(needs.prepare.outputs.shards) }}

        env:
            # 实际运行的源仓库。
            SOURCE_REPO: zhangMonday/Microsoft-Rewards-Script
            SOURCE_REF: v4

        steps:
            - name: 检出源仓库
              uses: actions/checkout@v7
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ env.SOURCE_REF }}
                  token: ${{ secrets.SOURCE_REPO_TOKEN }}
                  persist-credentials: false

            - name: 设置时区为北京时间
              run: |
                  sudo timedatectl set-timezone Asia/Shanghai
                  echo "当前时间: $(date)"

            - name: 下载中文字体
              run: |
                  [ -f /etc/apt/sources.list ] && sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list || true
                  [ -f /etc/apt/sources.list ] && sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list || true
                  [ -f /etc/apt/sources.list.d/ubuntu.sources ] && sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
                  [ -f /etc/apt/sources.list.d/ubuntu.sources ] && sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true

                  echo 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99custom > /dev/null
                  echo 'Acquire::ftp::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/99custom > /dev/null
                  echo 'Acquire::Retries "5";' | sudo tee -a /etc/apt/apt.conf.d/99custom > /dev/null
                  echo 'Acquire::ForceIPv4 "true";' | sudo tee -a /etc/apt/apt.conf.d/99custom > /dev/null

                  sudo apt-get update
                  sudo apt-get install -y fonts-wqy-zenhei

            - name: 安装 Xvfb 虚拟显示器
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb

            - name: 启动虚拟显示器
              run: |
                  Xvfb :99 -screen 0 1024x768x24 &
                  echo "DISPLAY=:99" >> "$GITHUB_ENV"

            - name: 设置 Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 安装依赖
              run: npm ci --ignore-scripts

            - name: 缓存 Patchright 浏览器
              id: browser-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: patchright-chromium-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      patchright-chromium-${{ runner.os }}-

            - name: 安装 Chromium（含系统依赖）
              run: npx patchright install --with-deps chromium

            - name: 恢复会话
              id: sessions-cache
              uses: actions/cache@v6
              with:
                  path: sessions
                  key: msr-sessions-shard-${{ matrix.chunk.shard }}-${{ github.run_id }}
                  restore-keys: |
                      msr-sessions-shard-${{ matrix.chunk.shard }}-
                      msr-sessions-

            - name: 写入完整账号配置 .env.full
              env:
                  ACCOUNTS_ENV: ${{ secrets.ACCOUNTS_ENV }}
              run: |
                  set -euo pipefail

                  if [ -z "${ACCOUNTS_ENV:-}" ]; then
                    echo "::error::Secret ACCOUNTS_ENV 为空。"
                    exit 1
                  fi

                  printf '%s\n' "$ACCOUNTS_ENV" > .env.full

                  echo "已写入 .env.full，共 $(grep -cE '^[[:space:]]*ACCOUNT_[0-9]+_EMAIL=' .env.full || true) 个账户邮箱行。"

            # 根据完整账号列表做全局代理分配，
            # 然后只输出当前 job 所负责的账号。
            - name: 按分片和代理规则生成 .env
              env:
                  SHARD: ${{ matrix.chunk.shard }}
                  PROXIES_JSON: ${{ needs.prepare.outputs.proxies }}
              run: |
                  set -euo pipefail

                  python3 <<'PY'
                  import json
                  import math
                  import os
                  import re

                  INPUT_FILE = ".env.full"
                  OUTPUT_FILE = ".env"

                  ACCOUNTS_PER_SHARD = 5

                  shard = int(os.environ["SHARD"])
                  proxies_json = os.environ.get("PROXIES_JSON", "[]").strip()

                  try:
                      proxies = json.loads(proxies_json or "[]")

                      if not isinstance(proxies, list):
                          raise ValueError("代理结果不是 JSON 数组")

                  except (json.JSONDecodeError, ValueError):
                      print(
                          "::warning::代理测试结果格式无效，"
                          "需要自动代理的账号将使用本机 IP。"
                      )
                      proxies = []

                  with open(INPUT_FILE, "r", encoding="utf-8") as file:
                      lines = file.read().splitlines()

                  email_re = re.compile(
                      r"^\s*ACCOUNT_(\d+)_EMAIL\s*=",
                      re.IGNORECASE,
                  )

                  # 匹配包括注释行在内的账号配置。
                  account_line_re = re.compile(
                      r"^(\s*(?:#\s*)?)"
                      r"ACCOUNT_(\d+)_([A-Za-z0-9_]+)"
                      r"(\s*=.*)$",
                      re.IGNORECASE,
                  )

                  proxy_line_re = re.compile(
                      r"^\s*(?:(#)\s*)?"
                      r"ACCOUNT_(\d+)_PROXY_(URL|PORT)\s*=(.*)$",
                      re.IGNORECASE,
                  )

                  account_ids = sorted({
                      int(match.group(1))
                      for line in lines
                      if (match := email_re.match(line))
                  })

                  if not account_ids:
                      raise SystemExit(
                          "ACCOUNTS_ENV 中没有找到有效的 ACCOUNT_N_EMAIL"
                      )

                  proxy_entries = {
                      account_id: {
                          "active": {},
                          "commented": {},
                      }
                      for account_id in account_ids
                  }

                  for line in lines:
                      match = proxy_line_re.match(line)

                      if not match:
                          continue

                      is_commented = bool(match.group(1))
                      account_id = int(match.group(2))
                      field = match.group(3).upper()
                      value = match.group(4).strip()

                      if account_id not in proxy_entries:
                          continue

                      target = (
                          proxy_entries[account_id]["commented"]
                          if is_commented
                          else proxy_entries[account_id]["active"]
                      )

                      target[field] = value

                  def classify(account_id):
                      entry = proxy_entries[account_id]
                      active = entry["active"]
                      commented = entry["commented"]

                      # 用户已经配置完整的未注释代理。
                      if (
                          active.get("URL", "") != ""
                          and active.get("PORT", "") != ""
                      ):
                          return "existing"

                      # 未注释代理行但为空或不完整。
                      if active:
                          return "disabled"

                      # 被注释代理行中有值。
                      if any(value != "" for value in commented.values()):
                          return "disabled"

                      # 无代理行，或仅有被注释的空代理行。
                      return "auto"

                  statuses = {
                      account_id: classify(account_id)
                      for account_id in account_ids
                  }

                  auto_account_ids = [
                      account_id
                      for account_id in account_ids
                      if statuses[account_id] == "auto"
                  ]

                  automatic_assignments = {}

                  auto_count = len(auto_account_ids)
                  proxy_count = len(proxies)

                  if auto_count > 0 and proxy_count > 0:
                      # 每 5 个自动代理账号使用一个 IP。
                      required_proxy_count = math.ceil(
                          auto_count / ACCOUNTS_PER_SHARD
                      )

                      if proxy_count >= required_proxy_count:
                          # 代理足够时，仅使用速度最快的若干代理。
                          used_proxy_count = required_proxy_count

                          for position, account_id in enumerate(
                              auto_account_ids
                          ):
                              proxy_index = (
                                  position // ACCOUNTS_PER_SHARD
                              )

                              automatic_assignments[account_id] = (
                                  proxies[proxy_index]
                              )

                          print(
                              f"代理充足：自动代理账号 {auto_count} 个，"
                              f"可用代理 {proxy_count} 个，"
                              f"使用速度最快的前 {used_proxy_count} 个代理，"
                              "每 5 个账号共用一个代理。"
                          )

                      else:
                          # 代理不足时，所有代理尽量平均分配。
                          used_proxy_count = proxy_count

                          for position, account_id in enumerate(
                              auto_account_ids
                          ):
                              proxy_index = (
                                  position * used_proxy_count
                              ) // auto_count

                              proxy_index = min(
                                  proxy_index,
                                  used_proxy_count - 1,
                              )

                              automatic_assignments[account_id] = (
                                  proxies[proxy_index]
                              )

                          print(
                              f"代理不足：自动代理账号 {auto_count} 个，"
                              f"可用代理 {proxy_count} 个，"
                              "所有可用代理将尽量平均分配。"
                          )

                  elif auto_count > 0:
                      print(
                          f"自动代理账号 {auto_count} 个，但没有可用代理；"
                          "这些账号将使用 GitHub Actions Runner 本机 IP。"
                      )

                  else:
                      print("没有需要自动配置代理的账号。")

                  start = shard * ACCOUNTS_PER_SHARD
                  selected_ids = account_ids[
                      start:start + ACCOUNTS_PER_SHARD
                  ]

                  if not selected_ids:
                      raise SystemExit(
                          f"分片 {shard} 没有可运行的账号。"
                      )

                  output_lines = []

                  # 保留非 ACCOUNT_N_ 开头的全局配置。
                  for line in lines:
                      match = account_line_re.match(line)

                      if match:
                          # 所有账号配置将在后续按当前分片重建。
                          continue

                      output_lines.append(line)

                  if output_lines and output_lines[-1] != "":
                      output_lines.append("")

                  # 当前分片账号重新编号为 ACCOUNT_1、ACCOUNT_2……
                  for new_id, old_id in enumerate(selected_ids, start=1):
                      # 复制账号普通配置；旧代理配置统一跳过。
                      for line in lines:
                          match = account_line_re.match(line)

                          if not match:
                              continue

                          line_account_id = int(match.group(2))
                          field = match.group(3)

                          if line_account_id != old_id:
                              continue

                          if field.upper() in {
                              "PROXY_URL",
                              "PROXY_PORT",
                          }:
                              continue

                          prefix = match.group(1)
                          suffix = match.group(4)

                          output_lines.append(
                              f"{prefix}ACCOUNT_{new_id}_{field}{suffix}"
                          )

                      status = statuses[old_id]

                      if status == "existing":
                          # 原本有完整代理：保留。
                          active = proxy_entries[old_id]["active"]

                          output_lines.append(
                              f"ACCOUNT_{new_id}_PROXY_URL="
                              f"{active['URL']}"
                          )

                          output_lines.append(
                              f"ACCOUNT_{new_id}_PROXY_PORT="
                              f"{active['PORT']}"
                          )

                          action = "保留用户已有代理"

                      elif (
                          status == "auto"
                          and old_id in automatic_assignments
                      ):
                          # 自动添加测速通过的代理。
                          proxy = automatic_assignments[old_id]

                          protocol = str(
                              proxy["protocol"]
                          ).strip().lower()

                          ip = str(proxy["ip"]).strip()
                          port = int(proxy["port"])
                          adr = str(proxy.get("adr", "未知地区"))
                          latency = proxy.get("latency")

                          host = (
                              f"[{ip}]"
                              if ":" in ip and not ip.startswith("[")
                              else ip
                          )

                          output_lines.append(
                              f"ACCOUNT_{new_id}_PROXY_URL="
                              f"{protocol}://{host}"
                          )

                          output_lines.append(
                              f"ACCOUNT_{new_id}_PROXY_PORT={port}"
                          )

                          latency_text = (
                              f"{float(latency):.3f}s"
                              if latency is not None
                              else "未知"
                          )

                          action = (
                              f"自动代理 "
                              f"{protocol}://{ip}:{port} "
                              f"地区={adr} "
                              f"测速={latency_text}"
                          )

                      elif status == "disabled":
                          # 用户明确要求不用代理：
                          # 不生成 PROXY_URL、PROXY_PORT 两行。
                          action = "按用户配置使用本机 IP"

                      else:
                          # 自动代理账号，但没有可用代理。
                          action = "无可用代理，使用本机 IP"

                      output_lines.append("")

                      print(
                          f"原账号槽位 {old_id} -> "
                          f"本 job 槽位 {new_id}：{action}"
                      )

                  while output_lines and output_lines[-1] == "":
                      output_lines.pop()

                  with open(OUTPUT_FILE, "w", encoding="utf-8") as file:
                      file.write("\n".join(output_lines) + "\n")

                  total_shards = math.ceil(
                      len(account_ids) / ACCOUNTS_PER_SHARD
                  )

                  print(
                      f"分片 {shard + 1}/{total_shards}："
                      f"总账号 {len(account_ids)} 个，"
                      f"本 job 负责 {len(selected_ids)} 个。"
                  )
                  PY

                  echo "当前分片 .env 已生成。"
                  echo "当前分片账号数：$(grep -cE '^[[:space:]]*ACCOUNT_[0-9]+_EMAIL=' .env || true)"
                  echo "当前分片启用代理数：$(grep -cE '^[[:space:]]*ACCOUNT_[0-9]+_PROXY_URL=.+$' .env || true)"

            - name: 构建 config.json
              env:
                  CONFIG_JSON: ${{ vars.CONFIG_JSON != '' && vars.CONFIG_JSON || secrets.CONFIG_JSON }}
                  INPUT_DEBUG_LOGS: ${{ inputs.debug_logs }}
                  INPUT_RUN_ON_ZERO_POINTS: ${{ inputs.run_on_zero_points }}
              run: |
                  set -euo pipefail

                  if [ -n "${CONFIG_JSON:-}" ]; then
                    printf '%s' "$CONFIG_JSON" > config.json
                    echo "使用来自仓库 variable/secret 的 CONFIG_JSON。"
                  else
                    cp config.example.json config.json
                    echo "未设置 CONFIG_JSON；使用 config.example.json 作为基础。"
                  fi

                  jq empty config.json

                  tmp=$(mktemp)

                  jq '.errorDiagnostics = true' config.json > "$tmp"
                  mv "$tmp" config.json

                  if [ "${INPUT_DEBUG_LOGS}" = "true" ]; then
                    tmp=$(mktemp)
                    jq '.debugLogs = true' config.json > "$tmp"
                    mv "$tmp" config.json
                  fi

                  if [ "${INPUT_RUN_ON_ZERO_POINTS}" = "true" ]; then
                    tmp=$(mktemp)
                    jq '.searchSettings.runOnZeroPoints = true' config.json > "$tmp"
                    mv "$tmp" config.json
                  fi

            - name: 构建
              run: npm run build

            - name: 运行 Microsoft Rewards 脚本
              run: npm start

            - name: 保存会话
              if: always()
              uses: actions/cache/save@v6
              with:
                  path: sessions
                  key: msr-sessions-shard-${{ matrix.chunk.shard }}-${{ github.run_id }}

            - name: 上传诊断信息
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: rewards-diagnostics-${{ github.run_id }}-shard${{ matrix.chunk.shard }}
                  path: |
                      diagnostics/
                      *.log
                  if-no-files-found: ignore
                  retention-days: 7
